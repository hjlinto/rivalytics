services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rivalytics-backend
    env_file:
      - backend/.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rivalytics-frontend
    env_file:
      - frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend